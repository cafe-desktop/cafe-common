# This is a basic workflow to help you get started with Actions

name: docker

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Reusable workflow used by every cafe-desktop repo: their
  # .github/workflows/main.yml is a thin trigger stub that calls this file.
  # The build matrix below defines, in this single place, the distros and
  # gh-pages policy for the whole organization.
  workflow_call:
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # One job per distro.  debian_testing builds the default 'debian' distro
  # and is the only one that deploys html-report to gh-pages.
  build-and-deploy:
    name: ${{ matrix.name }}
    strategy:
      # keep the distros independent: a failure in one does not cancel the others
      fail-fast: false
      matrix:
        include:
          - name: debian_stable
            distro: debian:stable
            gh_pages: 'false'
          - name: debian_testing
          - name: debian_sid
            distro: debian:sid
            gh_pages: 'false'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Install dependencies
        run: python -m pip install PyGithub

      - name: Check Out Repo
        uses: actions/checkout@main

      - name: Login to Docker Hub
        uses: docker/login-action@master
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        if: ${{ env.DOCKER_USER != '' }}
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      # Local copy of the helper scripts instead of downloading them from
      # raw.githubusercontent.com: a transient GitHub error page (502/503/504)
      # can no longer be saved and executed as a shell script.
      - name: Check out dev-scripts
        uses: actions/checkout@main
        with:
          repository: cafe-desktop/cafe-dev-scripts
          ref: master
          path: dev-scripts

      - name: install docker-build
        env:
          DEV_SCRIPTS_SRC: ${{ github.workspace }}/dev-scripts
        run: |
          set -euo pipefail
          chmod +x dev-scripts/travis/build/*.sh
          dev-scripts/travis/build/install-dockerbuild.sh
          cp dev-scripts/travis/build/build-push.sh build-push
          chmod +x build-push

      - name: Build and push
        env:
          TRAVIS_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ./build-push ${{ matrix.distro }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        env:
          GH_DEPLOY: ${{ matrix.gh_pages }}
        if: ${{ github.event_name == 'push' && env.GH_DEPLOY != 'false' }}
        with:
          branch: gh-pages
          folder: html-report
          single-commit: true
