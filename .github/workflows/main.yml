# This is a basic workflow to help you get started with Actions

name: CI to Docker Hub

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      tag:
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true
      DOCKER_HUB_DISTRO:
        required: false
      GH_PAGES_DEPLOY:
        required: false

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-and-deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Install dependencies
        run: python -m pip install PyGithub

      - name: Check Out Repo
        uses: actions/checkout@main

      - name: Login to Docker Hub
        uses: docker/login-action@master
        env:
          DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
        if: ${{ env.DOCKER_USER != '' }}
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      # Local copy of the helper scripts instead of downloading them from
      # raw.githubusercontent.com: a transient GitHub error page (502/503/504)
      # can no longer be saved and executed as a shell script.
      - name: Check out dev-scripts
        uses: actions/checkout@main
        with:
          repository: cafe-desktop/cafe-dev-scripts
          ref: master
          path: dev-scripts

      - name: install docker-build
        env:
          DEV_SCRIPTS_SRC: ${{ github.workspace }}/dev-scripts
        run: |
          set -euo pipefail
          chmod +x dev-scripts/travis/build/*.sh
          dev-scripts/travis/build/install-dockerbuild.sh
          cp dev-scripts/travis/build/build-push.sh build-push
          chmod +x build-push

      - name: Build and push
        env:
          TRAVIS_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ./build-push ${{ secrets.DOCKER_HUB_DISTRO }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        env:
          GH_DEPLOY: ${{ secrets.GH_PAGES_DEPLOY }}
        if: ${{ github.event_name == 'push' && env.GH_DEPLOY != 'false' }}
        with:
          branch: gh-pages
          folder: html-report
          single-commit: true

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
